<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página B</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; max-width: 480px; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { color: #999; font-size: 1rem; line-height: 1.6; margin-bottom: 2.5rem; }
    .btn {
      display: inline-block;
      background: #fff;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 2.5rem;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .tag { font-size: 0.75rem; color: #555; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Comece sua transformação hoje</h1>
    <p>Método comprovado para alcançar os resultados que você sempre quis.</p>
    <a class="btn" href="https://pay.kiwify.com.br/IX0GhxS">Começar agora</a>
    <p class="tag">Variante B</p>
  </div>
  <script src="https://teste-ab-production.up.railway.app/tracker.js"></script>
</body>
</html>
